<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BodyFuel Fitness</title>
  <style>
body {
  overflow: hidden;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  padding: 20px;
}

.card {
  padding: 10px;
}
img {
  width: 100%;
  aspect-ratio: 16 / 9;   /* Perfect horizontal ratio */
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
}
    img:hover {
  transform: scale(1.05);
  transition: 0.3s;
}
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <a href="strength.html">
    <img src="gym1.jpg">
  </a>
  <p>Strength Training</p>
</div>

<div class="card">
  <a href="fullbody.html">
    <img src="gym2.jpg">
  </a>
  <p>Full Body Workout</p>
</div>

<div class="card">
  <a href="kettlebell.html">
    <img src="gym3.jpg">
  </a>
  <p>Kettlebell Training</p>
</div>
<button class="btn" onclick="goBack()">⬅ Back to Home</button>

<script>
  function goBack() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
