<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BodyFuel Fitness</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}
   img {
  width: 100%;
  height: 180px;        /* Medium size */
  object-fit: cover;    /* Keeps image nicely cropped */
  border-radius: 10px;
  cursor: pointer;      /* Shows clickable cursor */
     
}
    img:hover {
  transform: scale(1.05);
  transition: 0.3s;
}
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <a href="strength.html">
    <img src="gym1.jpg">
  </a>
  <p>Strength Training</p>
</div>

<div class="card">
  <a href="fullbody.html">
    <img src="gym2.jpg">
  </a>
  <p>Full Body Workout</p>
</div>

<div class="card">
  <a href="kettlebell.html">
    <img src="gym3.jpg">
  </a>
  <p>Kettlebell Training</p>
</div>
<button class="btn" onclick="goBack()">⬅ Back to Home</button>

<script>
  function goBack() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
