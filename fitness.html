<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BodyFuel Fitness</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    /* QUOTE STYLE */
    .quote {
      font-size: 20px;
      font-style: italic;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .author {
      font-size: 14px;
      margin-bottom: 30px;
      color: #94a3b8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .card {
      padding: 10px;
    }

    img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
    }

    img:hover {
      transform: scale(1.05);
      transition: 0.3s;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>

  <!-- QUOTE -->
  <div class="quote">
    “What is the point of being on this Earth if you are going to be like everyone else?”
  </div>
  <div class="author">
    — Arnold Schwarzenegger
  </div>

  <!-- GRID -->
  <div class="grid">

    <div class="card">
      <a href="strength.html">
        <img src="gym1.jpg">
      </a>
      <p>Strength Training</p>
    </div>

    <div class="card">
      <a href="fullbody.html">
        <img src="gym2.jpg">
      </a>
      <p>Full Body Workout</p>
    </div>

    <div class="card">
      <a href="kettlebell.html">
        <img src="gym3.jpg">
      </a>
      <p>Kettlebell Training</p>
    </div>

  </div>

  <!-- BACK BUTTON -->
  <button class="btn" onclick="goBack()">⬅ Back to Home</button>

  <script>
    function goBack() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
