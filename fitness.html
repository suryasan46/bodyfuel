<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BodyFuel Fitness</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>💪 Fitness Training</h1>

<div class="grid">
  <div class="card">
    <img src="gym1.jpg">
    <p>Strength Training</p>
  </div>

  <div class="card">
    <img src="gym2.jpg">
    <p>Full Body Workout</p>
  </div>

  <div class="card">
    <img src="gym3.jpg">
    <p>Kettlebell Training</p>
  </div>
</div>

<button class="btn" onclick="goBack()">⬅ Back to Home</button>

<script>
  function goBack() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
