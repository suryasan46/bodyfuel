<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodyFuel Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: rgba(15, 23, 42, 0.9);
      position: sticky;
      top: 0;
    }

    header h1 {
      color: #38bdf8;
    }

    nav a {
      color: #e2e8f0;
      margin-left: 20px;
      text-decoration: none;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: url('gym2.jpg') center/cover no-repeat;
    }

    .hero h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .btn {
      padding: 12px 25px;
      background: #38bdf8;
      border: none;
      border-radius: 30px;
      color: black;
      font-weight: 600;
      cursor: pointer;
    }

    .section {
      padding: 60px 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #020617;
      color: #64748b;
    }
  </style>
</head>
<body>

<header>
  <h1>BodyFuel</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="fitness.html">Fitness</a>
    <a href="#">Lifestyle</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h2>Build Your Best Body & Lifestyle</h2>
  <p>Fuel your body. Elevate your lifestyle.</p>
  <button class="btn" onclick="goToFitness()">Get Started</button>
</section>

<!-- SERVICES -->
<section class="section">
  <h3>What We Offer</h3>
  <div class="grid">
    <div class="card">
      <h4>💪 Fitness</h4>
      <p>Workout plans & training guides.</p>
    </div>

    <div class="card">
      <h4>🧘 Lifestyle</h4>
      <p>Healthy habits & routines.</p>
    </div>

    <div class="card">
      <h4>🛒 Products</h4>
      <p>Top fitness & lifestyle gear.</p>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section">
  <h3>📩 Contact</h3>
  <button class="btn" onclick="contactMe()">Contact Me</button>
</section>

<footer>
  <p>© 2026 BodyFuel Premium</p>
</footer>

<script>
  function goToFitness() {
    window.location.href = "fitness.html";
  }

  function contactMe() {
    window.location.href = "mailto:youremail@gmail.com";
  }
</script>

</body>
</html>
